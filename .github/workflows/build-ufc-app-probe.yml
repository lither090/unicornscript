name: Build UFC App Probe APK

on:
  push:
    paths:
      - 'android-app-probe/source.zip.b64'
      - '.github/workflows/build-ufc-app-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source bundle
        run: |
          base64 -d android-app-probe/source.zip.b64 > /tmp/UFC-App-Probe-source.zip
          unzip -q /tmp/UFC-App-Probe-source.zip -d /tmp/ufc-src
          ls -la /tmp/ufc-src/UFC-App-Probe

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: /tmp/ufc-src/UFC-App-Probe
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp /tmp/ufc-src/UFC-App-Probe/app/build/outputs/apk/debug/app-debug.apk /tmp/UFC-App-Probe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-App-Probe-debug
          path: /tmp/UFC-App-Probe.apk
          if-no-files-found: error
